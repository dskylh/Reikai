name: S23 build

# A debug APK for the owner's Galaxy S23 (arm64-v8a) from any push to a Claude working branch, or on demand.
# It installs as app.reikai.dev beside the release app. The debug keystore is cached so each build signs with
# the same key and installs over the last one.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - 'ccr-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build arm64 debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the build
        uses: ./.github/actions/setup-build
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Restore the debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: s23-debug-keystore

      - name: Build the app
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reikai-s23-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
